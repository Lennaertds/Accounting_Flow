services:
  db:
    image: postgres:16-alpine
    container_name: boekhoud_dwh
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    networks:
      - boekhoud_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: boekhoud_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - boekhoud_net

networks:
  boekhoud_net:
    driver: bridge