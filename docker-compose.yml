# docker-compose.yml

services:
  # 1. Database Service (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: papertrade_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Applicatie Service (De NestJS API)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Gebruik network: host om DNS problemen te voorkomen op arch linux (of toch in mijn geval)
      # network: host
    container_name: papertrade_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUTH_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: